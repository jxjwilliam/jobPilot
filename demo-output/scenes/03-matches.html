<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Scene 4 - Matches</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1920px; height: 1080px;
  background: #0d0e12;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.glow {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%; filter: blur(100px);
  opacity: 0.2;
}
.glow-1 { top: -80px; left: -80px; background: #7c6af5; }
.glow-2 { bottom: -80px; right: -80px; background: #fbbf24; }
.screenshot {
  position: absolute;
  width: 1560px; height: auto;
  border-radius: 12px;
  box-shadow: 0 20px 100px rgba(0,0,0,0.6);
  animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 260px;
  background: linear-gradient(transparent, rgba(13,14,18,0.92));
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 50px 100px;
}
.title {
  font-size: 42px; font-weight: 800;
  color: #c5d5ff; letter-spacing: -1px;
  animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
}
.title em { color: #fbbf24; font-style: normal; }
.sub {
  font-size: 18px; font-weight: 400;
  color: rgba(197,213,255,0.5); margin-top: 6px;
  animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
}
@keyframes zoomIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <img class="screenshot" src="../../screenshots/matches.png">
  <div class="overlay">
    <div class="title">Every job scored against <em>your</em> profile</div>
    <div class="sub">AI match scores from 0 to 100 — focus on what fits</div>
  </div>
</body>
</html>
